readme = "README.md"
authors = [
    { email = "atirekgupta09@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "colorama>=0.4.6",
    "langchain>=1.5.2",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.5.2",
